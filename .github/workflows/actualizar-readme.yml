# Once a day (and by hand from the Actions tab): download the CV data that kairomx.tech publishes,
# regenerate the README and commit only if something changed. If the site is down or its data does not
# meet the contract, the run fails, nothing is committed and the README stays as it was.
# No secrets: only this repository's GITHUB_TOKEN, allowed to write contents and nothing else. No value
# from the downloaded file is ever placed in a shell command.
#
# Undoing a README change: `git revert` alone does not last, the next run rebuilds the README from the
# CV. Change the CV, or first turn this workflow off (Actions tab, this workflow, "Disable workflow")
# and then revert.
# GitHub turns scheduled workflows off by itself in a public repository after 60 days without any
# activity. It shows in the Actions tab (the workflow is marked as disabled and no new runs appear);
# turn it back on there with "Enable workflow". Nothing commits just to keep it alive.
# A CV text that does not fit makes every run fail until it is shortened in the CV; the error says
# which text, in which language, how long it is and how much fits.
name: Update README from the CV

on:
  schedule:
    - cron: "17 13 * * *" # 13:17 UTC every day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Download the CV data and regenerate
        run: node generador/actualizar.mjs --message "$RUNNER_TEMP/commit-message.txt"
      - name: Check the result
        run: node pruebas/comprobar.mjs
      - name: Commit and push if anything changed
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git add -A
          git commit -F "$RUNNER_TEMP/commit-message.txt"
          git push
